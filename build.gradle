plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

javafx {
    version = "25"
    modules = [
            'javafx.controls',
            'javafx.fxml'
    ]
}

application {
    mainClass = 'org.darwin_world.MainGUI'
}

test {
    useJUnitPlatform()
}
